version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "tailwindcss"
      typescript:
        patterns:
          - "typescript"
        update-types:
          - "patch"
      tailwindcss:
        patterns:
          - "tailwindcss"
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    versioning-strategy: increase
    target-branch: main

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    target-branch: main